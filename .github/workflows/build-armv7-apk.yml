name: Build ARMv7 APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ARMv7 (armeabi-v7a) APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ARMv7 APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building ARMv7 ($BUILD_TYPE)..."
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease -PtargetAbi=armeabi-v7a --stacktrace
          else
            ./gradlew :app:assembleDebug -PtargetAbi=armeabi-v7a --stacktrace
          fi

      - name: Locate and Prepare ARMv7 APK
        run: |
          mkdir -p output_apk
          # Locate generated APK for armeabi-v7a or fallback
          ARMV7_APK=$(find app/build/outputs/apk -name "*armeabi-v7a*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$ARMV7_APK" ] && [ -f "$ARMV7_APK" ]; then
            echo "Found APK: $ARMV7_APK"
            cp "$ARMV7_APK" output_apk/TextShift-armeabi-v7a.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextShift-armeabi-v7a-APK
          path: output_apk/TextShift-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/TextShift-armeabi-v7a.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
